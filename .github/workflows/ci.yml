name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  # Keep PR workflows and existing check names present; filter jobs, not triggers.
  scope:
    name: Change scope
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_full: ${{ steps.changes.outputs.run_full }}
    steps:
      - name: Check out the comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select documentation or full validation
        id: changes
        shell: bash
        env:
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          run_full=true
          base=""
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" != tag ]]; then
            base="$PUSH_BASE"
          fi
          # Dispatches, release tags, new branches and unavailable history stay full.
          if [[ "$base" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git diff --name-only --no-renames -z "$base" HEAD > "$RUNNER_TEMP/changed-paths"
            run_full=false
            while IFS= read -r -d '' path; do
              case "$path" in
                # Release/package inputs and safety audits retain full validation.
                docs/releases/* | docs/unsafe*.md) run_full=true; break ;;
                README.md | docs/*.md) ;;
                *) run_full=true; break ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
          fi
          echo "run_full=$run_full" >> "$GITHUB_OUTPUT"
          echo "Full validation: $run_full"

  frontend:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.run_full != 'false' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          check-latest: false
      - name: Build the pinned Web dependency graph
        run: |
          node --version
          npm --version
          npm ci --prefix web
          npm run check:xcss --prefix web
          npm run test:unit --prefix web
          npm run build --prefix web
      - name: Install acceptance browsers
        working-directory: web
        run: npx playwright install --with-deps chromium firefox
      - name: Verify business UI and shared platform integration
        working-directory: web
        run: npm run test:browser

  rust:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.run_full != 'false' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the pinned xcss product manifest
        shell: bash
        run: |
          set -euo pipefail
          readarray -t foundation_identity < <(python3 - <<'PY'
          import tomllib
          with open("xcss-product.toml", "rb") as stream:
              foundation = tomllib.load(stream)["foundation"]
          print(foundation["version"])
          print(foundation["git_rev"])
          PY
          )
          foundation_root="$RUNNER_TEMP/xcss"
          git clone --quiet --filter=blob:none --depth=1 \
            --branch "v${foundation_identity[0]}" \
            https://github.com/isarmg/xcss.git \
            "$foundation_root"
          test "$(git -C "$foundation_root" rev-parse HEAD)" = "${foundation_identity[1]}"
          python3 "$foundation_root/scripts/xcss-conformance.py" \
            verify-manifest --product-root "$GITHUB_WORKSPACE"
      - name: Install Rust 1.99
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          check-latest: false
      - name: Build current Web compilation inputs
        run: |
          npm ci --prefix web
          web/node_modules/.bin/xcss-build-server --config "$PWD/xcss-web-build.json" --mode development --web-only --no-install
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check all targets
        run: cargo check --locked --workspace --all-targets --all-features
      - name: Lint all targets
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test all features
        run: cargo test --locked --workspace --all-features
      - name: Smoke-test relocated binary and static assets
        run: ./scripts/relocated-smoke-test.sh

  native-shell:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.run_full != 'false' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tracked native shell scripts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' scripts < <(git ls-files -z -- 'scripts/*.sh' 'deploy/*.sh' 'deploy/.*-action.sh' 'deploy/xcosctl')
          if (( ${#scripts[@]} == 0 )); then
            echo 'No tracked native shell scripts found.' >&2
            exit 1
          fi
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
          shellcheck "${scripts[@]}"
      - name: Exercise immutable native release lifecycle
        run: ./scripts/lifecycle-test.sh
      - name: Verify root and service-owner native input boundaries
        run: sudo python3 scripts/private-input-ownership-test.py
      - name: Exercise the real pinned companion configuration
        shell: bash
        run: |
          set -euo pipefail
          companion_dir="$(mktemp -d)"
          curl --fail --location --retry 3 --output "$companion_dir/mediamtx.tar.gz" \
            https://github.com/bluenviron/mediamtx/releases/download/v1.20.0/mediamtx_v1.20.0_linux_amd64.tar.gz
          tar -xzf "$companion_dir/mediamtx.tar.gz" -C "$companion_dir" mediamtx
          python3 scripts/companion-smoke-test.py "$companion_dir/mediamtx"
      - name: Validate the current native proxy contract
        shell: bash
        run: |
          set -euo pipefail
          test ! -e Caddyfile
          test -f deploy/Caddyfile
          test "$(grep -Fxc '        reverse_proxy {$XCOS_WEBRTC_UPSTREAM:127.0.0.1:8889}' deploy/Caddyfile)" -eq 1
          test "$(grep -Fxc '        reverse_proxy {$XCOS_HLS_UPSTREAM:127.0.0.1:8888} {' deploy/Caddyfile)" -eq 1
          test "$(grep -Fxc '            header_down Location "^/(.*)$" "/media-hls/$1"' deploy/Caddyfile)" -eq 1
          test "$(grep -Fxc '        reverse_proxy {$XCOS_HTTP_UPSTREAM:127.0.0.1:8080}' deploy/Caddyfile)" -eq 1
          if grep -Eq 'reverse_proxy[[:space:]]+(app|mediamtx):' deploy/Caddyfile; then
            echo 'Container-only proxy names are outside the current native contract.' >&2
            exit 1
          fi
