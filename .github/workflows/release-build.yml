name: Release build

on:
  push:
    tags: [v0.2.2]

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact annotated release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          check-latest: false
      - name: Install locked Web dependencies
        run: npm ci --prefix clients/web
      - name: Build and verify the immutable Server archive
        run: |
          mkdir -p "$RUNNER_TEMP/release-output"
          bash native/package-release.sh "$RUNNER_TEMP/release-output"
      - name: Retain verified release inputs for explicit publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-server
          path: ${{ runner.temp }}/release-output/*
          if-no-files-found: error
