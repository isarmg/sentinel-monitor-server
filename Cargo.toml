[package]
name = "xcos"
version = "1.0.0"
edition = "2021"
rust-version = "1.99"
description = "Maintainable Rust control plane for browser-based camera monitoring"
build = "build.rs"

[dependencies]
xcss = { git = "https://github.com/isarmg/xcss.git", rev = "9637806055b7d7a18be206f0b83e9b22b73902db", version = "=1.0.0", features = ["tracing"] }
anyhow = "1"
async-trait = "0.1"
async-stream = "0.3"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.23.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3"
hkdf = "0.13"
hex = "0.4"
jsonwebtoken = { version = "11.1", default-features = false, features = ["aws_lc_rs"] }
getrandom = "0.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "query", "rustls"] }
rustix = { version = "=1.1.5", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "uuid", "chrono", "json", "derive"] }
thiserror = "2"
tokio = { version = "1.53.2", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["compression-gzip", "fs", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
serde_json = "1"
xcss = { git = "https://github.com/isarmg/xcss.git", rev = "9637806055b7d7a18be206f0b83e9b22b73902db", version = "=1.0.0" }

[lints.rust]
unsafe_code = "forbid"
